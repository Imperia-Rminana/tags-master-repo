name: Build Core

on:
  workflow_call:
    inputs:
      ref:
        description: Full tags-slave-repo branch name or commit SHA to validate
        required: true
        type: string
    secrets:
      SCP_STUDIO_DEVELOPMENT_PAT:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Full tags-slave-repo branch name or commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  build_core:
    name: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact Development source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Imperia-Rminana/tags-slave-repo
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SCP_STUDIO_DEVELOPMENT_PAT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Slave dependencies
        shell: bash
        run: npm ci

      - name: Test Slave source
        shell: bash
        run: npm test
