name: Open release promotion

on:
  workflow_call:
    inputs:
      tag:
        description: "Published Development tag (ex. core/2.0.0)"
        required: true
        type: string
      target_sha:
        description: Exact 40-character Development commit SHA
        required: true
        type: string
      source_branch:
        required: true
        type: string
      previous_tag:
        required: false
        default: ""
        type: string
      is_override:
        required: true
        type: string
      override_reason:
        required: false
        default: ""
        type: string
      requested_by:
        required: true
        type: string
      approval_environment:
        required: true
        type: string
      concurrency_group:
        required: true
        type: string
    secrets:
      SCP_STUDIO_DEVELOPMENT_PAT:
        required: true
      SCP_PROMOTION_CONTRACT_SECRET:
        required: true

permissions:
  contents: read

jobs:
  open_promotion:
    name: Open direct promotion pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.approval_environment }}
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false

    steps:
      - name: Check out release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Open or update direct promotion pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEVELOPMENT_OWNER: imperia-scm
          DEVELOPMENT_REPOSITORY: tags-slave-repo-fork
          PARENT_OWNER: Imperia-Rminana
          PARENT_REPOSITORY: tags-slave-repo
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          IS_OVERRIDE: ${{ inputs.is_override }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          CONTRACT_SECRET: ${{ secrets.SCP_PROMOTION_CONTRACT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.SCP_STUDIO_DEVELOPMENT_PAT }}
          script: |
            const OpenPromotion = require(
              './automation/.github/scripts/release-api/open-promotion.cjs'
            );
            await OpenPromotion({ github, core, inputs: process.env });
