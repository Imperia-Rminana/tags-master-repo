name: Finalize merged promotion

on:
  repository_dispatch:
    types:
      - promotion_merged
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Merged scp-codex PR number (example: 1234)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    finalize-promotion-${{
      github.event.client_payload.parent_repository || 'Imperia-Rminana/tags-slave-repo'
    }}-${{
      github.event.client_payload.pull_request_number || inputs.pull_request_number
    }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Tag Codex and open reintegration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          fetch-depth: 1
          persist-credentials: false

      - name: Finalize merged promotion
        id: finalize
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPATCH_PARENT_REPOSITORY: ${{ github.event.client_payload.parent_repository }}
          PARENT_OWNER: Imperia-Rminana
          PARENT_REPOSITORY: tags-slave-repo
          DEVELOPMENT_OWNER: imperia-scm
          DEVELOPMENT_REPOSITORY: tags-slave-repo-fork
          DEVELOPMENT_TRUNK_BRANCH: main
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.client_payload.pull_request_number || inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          EXPECTED_MERGE_COMMIT_SHA: ${{ github.event.client_payload.merge_commit_sha }}
          CONTRACT_SECRET: ${{ secrets.SCP_PROMOTION_CONTRACT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.SCP_STUDIO_DEVELOPMENT_PAT }}
          script: |
            const expectedParent = `${process.env.PARENT_OWNER}/${process.env.PARENT_REPOSITORY}`;
            if (context.eventName === 'repository_dispatch' &&
                process.env.DISPATCH_PARENT_REPOSITORY !== expectedParent)
            {
              throw new Error('The dispatch parent repository is not allowed.');
            }

            const FinalizePromotion = require(
              './automation/.github/scripts/release-api/finalize-promotion.cjs'
            );
            await FinalizePromotion({ github, core, inputs: process.env });

      - name: Write finalization result
        shell: bash
        env:
          TAG: ${{ steps.finalize.outputs.tag }}
          DEVELOPMENT_TAG_EXISTED: ${{ steps.finalize.outputs.development_tag_existed }}
          RELEASE_CREATED: ${{ steps.finalize.outputs.release_created }}
          PARENT_TAG_EXISTED: ${{ steps.finalize.outputs.parent_tag_existed }}
          REINTEGRATION_PR_URL: ${{ steps.finalize.outputs.reintegration_pr_url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Promotion finalized

          - Development and Codex tag: \`$TAG\`
          - Development tag already existed: \`$DEVELOPMENT_TAG_EXISTED\`
          - GitHub Release created in this run: \`$RELEASE_CREATED\`
          - Codex tag already existed: \`$PARENT_TAG_EXISTED\`
          - Reintegration pull request: \`$REINTEGRATION_PR_URL\`
          EOF
