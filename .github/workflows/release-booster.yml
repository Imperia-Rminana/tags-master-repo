name: Release Booster

on:
  workflow_dispatch:
    inputs:
      booster_name:
        description: "Lowercase booster name only (example: demo)"
        required: true
        type: string
      release_line:
        description: "Release line only (example: 1.0). Do not enter boost/demo/1.0"
        required: true
        type: string
      dry_run:
        description: "Preview without publishing (example: true). Use false to create the release"
        required: true
        default: true
        type: boolean
      override_version:
        description: "Optional exact version (example: 1.0.3). Leave empty for automatic patch"
        required: false
        type: string
      override_reason:
        description: "Reason for the override (example: Recover skipped version). Otherwise leave empty"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Booster ${{ inputs.booster_name }} ${{ inputs.release_line }}
    uses: ./.github/workflows/_create-release.yml
    permissions:
      contents: read
    with:
      component: booster
      booster_name: ${{ inputs.booster_name }}
      release_line: ${{ inputs.release_line }}
      source_branch: boost/${{ inputs.booster_name }}/${{ inputs.release_line }}
      dry_run: ${{ inputs.dry_run }}
      override_version: ${{ inputs.override_version }}
      override_reason: ${{ inputs.override_reason }}
    secrets:
      SCP_STUDIO_DEVELOPMENT_PAT: ${{ secrets.SCP_STUDIO_DEVELOPMENT_PAT }}
      SCP_PROMOTION_CONTRACT_SECRET: ${{ secrets.SCP_PROMOTION_CONTRACT_SECRET }}
